[package]
name = "ai-dict"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_dict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 数据库：只开 sqlite 驱动
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
# 截图以 PNG 的 base64 在前端和 Rust 之间传（见 src/ocr.rs）
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# 取选中文字（见 src/selection.rs）。
# macOS 自己实现，不用 get-selected-text：它在 macOS 上的回退路径要靠 osascript 模拟 Cmd+C，
# 会多要一条「自动化」权限（控制 System Events），开发期重新构建后这个授权还容易失效。
[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3"
# 读辅助功能接口返回的 CFString
core-foundation = "0.9"
# 合成 Cmd+C、读修饰键状态
core-graphics = "0.22"
# 取前台应用的 pid（NSWorkspace.frontmostApplication）
objc = "0.2"

# Windows 用 get-selected-text（MIT）：它模拟 Ctrl+C 读剪贴板，剪贴板自己会还原
[target.'cfg(target_os = "windows")'.dependencies]
get-selected-text = "0.1.6"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# 截图翻译（见 src/ocr.rs）：GDI 截选区 + Windows.Media.Ocr。OCR 是 WinRT 接口，windows-sys 没有，
# 用和 Tauri 依赖树里同一版的 windows，不多编一份
windows = { version = "0.62", features = [
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Graphics_Gdi",
] }
# GDI 的像素编成 PNG、再解回来；只要 PNG，别的格式不带（见 src/ocr.rs）
image = { version = "0.25", default-features = false, features = ["png"] }
